name: UI - Offline LLM statistics
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/llm-statistics.js
      - run: node --test tests/llm-statistics-ui.test.cjs
