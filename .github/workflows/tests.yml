name: CI — test H1 calculations
on:
  push:
    paths:
      - "h1lab/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q h1lab scripts
      - run: python -m unittest discover -s tests -v
