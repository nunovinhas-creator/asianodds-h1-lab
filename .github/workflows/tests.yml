name: CI — test H1 calculations
on:
  push:
    paths:
      - "h1lab/**"
      - "scripts/**"
      - "tests/**"
      - "scheduler/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q h1lab scripts
      - run: python -m unittest discover -s tests -v
      - name: Five V5 strategies — read-only current-fixture dry-run (never sends Telegram)
        run: python -m h1lab.strategy_notify --dry-run
      - name: V6 P0 10,000 null trajectories, power and FT chronological gates (shadow)
        run: |
          python -m scripts.lab_v6_p0 --recompute-nulls
          python -m scripts.lab_v6_p0 --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          sim=json.loads(Path('docs/lab/v6-p0-null-simulation.json').read_text())
          gate=json.loads(Path('docs/lab/v6-p0-gates.json').read_text())
          assert sim['null']['paths']==10000
          assert len(sim['illustrative_power'])==3
          assert sim['scientific_state']=='INCONCLUSIVO'
          assert gate['scientific_state']=='INCONCLUSIVO'
          assert all(g['scientific_acceptance']=='BLOCKED' for g in gate['gates'].values())
          print('V6_P0_REAL_SMOKE',sim['null']['ever_hit_at_any_look'],
                gate['gates']['7_days']['status'],gate['gates']['14_days']['status'])
          PY
      - name: V6.2 P2#14 real LAB monthly archives, all-file limit and SHA replay
        run: |
          python -m scripts.lab_v6_archive
          python -m scripts.lab_v6_archive --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/lab/v6-archive-health.json').read_text(encoding='utf-8'))
          assert report['status']=='V6_LAB_ARCHIVE_INTEGRITY_SHADOW'
          assert report['scientific_state']=='INCONCLUSIVO'
          assert report['largest_file_bytes'] <= 20_000_000
          assert report['replay']['v6_forecasts'] >= 1
          print('V6_ARCHIVE_REAL_SMOKE_OK',report['lab_files_checked'],report['monthly_parts'])
          PY
      - name: V6.2 P2#13 real observations, frozen catalogue, replay and integrity
        run: |
          python -m scripts.lab_v6_hypothesis_pruning
          python -m scripts.lab_v6_hypothesis_pruning --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/lab/v6-pruning.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status']=='V6_EXPLORATORY_PODA_NOT_VALIDATED'
          assert r['scientific_state']=='INCONCLUSIVO'
          assert r['scope']['original_catalog']==800
          assert r['scope']['mapped_originals']==800
          assert r['scope']['representatives']<=300
          assert r['source']['ft_outcomes_used'] is False
          assert r['effective_tests']['not_a_multiple_testing_alpha_adjustment']
          print('V6_P2_13_REAL_REPLAY_OK',r['scope']['observed_matches_frozen'],
                r['scope']['representatives'],r['effective_tests']['estimate'])
          PY
      - name: V6 all-hypothesis market residual smoke (no API / no push)
        run: |
          python -m scripts.lab_v6_residual
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/v6-residual-research.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_EXPLORATORY_MARKET_RELATIVE_NO_BETS'
          assert len(d['all_hypotheses'])==d['generation']['hypotheses_evaluated']
          assert all(x['btts_yes_vs_market']['state']=='MODEL_REFERENCE_NOT_AVAILABLE'
                     for x in d['all_hypotheses'])
          assert d['method']['freeze_or_validate'] is False
          print('V6_RESIDUAL_REAL_INPUT_OK',len(d['all_hypotheses']))
          PY
      - name: V6 smoke using real repository snapshots (no API / no push)
        run: |
          python -m scripts.lab_v6_shadow
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_shadow import read_journal
          root=Path('.')
          report=json.loads((root/'docs/lab/v6-shadow.json').read_text(encoding='utf-8'))
          prices=json.loads((root/'docs/lab/v6-price-quality.json').read_text(encoding='utf-8'))
          assert report['hypothesis']['state'] in ('INCONCLUSIVO','VALIDADO')
          assert prices['scope']=='HISTORICAL_PRICE_QA_NOT_FORECASTS'
          assert len(prices['snapshots'])==report['price_quality_historical']['total_snapshots']
          assert len(read_journal(root))==report['forecasts']['records']
          rd=json.loads((root/'docs/lab/v6-readiness.json').read_text(encoding='utf-8'))
          assert rd['status']=='V6_COVERAGE_OBSERVABILITY_NOT_MODEL_VALIDATION'
          assert rd['records']==report['forecasts']['records']
          assert rd['p0_7_day_gate'] in ('WARMUP','SOURCE_COVERAGE_PASS_PENDING_EXTERNAL_VERIFICATION','SOURCE_COVERAGE_BELOW_99_PERCENT')
          print('V6_REAL_INPUT_SMOKE_OK',len(prices['snapshots']))
          PY
      - name: V6F2 observed markets smoke (real data, no backfill)
        run: |
          python -m scripts.lab_v6_feature_coverage
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_shadow import read_journal
          from h1lab.v6_features_v2 import verify
          d=json.loads(Path('docs/lab/v6-feature-coverage.json').read_text(encoding='utf-8'))
          j=read_journal('.')
          assert d['status']=='V6F2_SHADOW_COVERAGE_NOT_VALIDATED'
          assert d['total_records']==len(j)
          assert sum(d['snapshot_versions'].values())==len(j)
          assert all(verify(x['feature_context_v2']) for x in j if 'feature_context_v2' in x)
          print('V6F2_REAL_CAPTURE_COVERAGE_OK',d['snapshot_versions'])
          PY
      - name: V6 scientific memory replay smoke on real frozen snapshots
        run: |
          python -m scripts.lab_v6_memory
          python -m scripts.lab_v6_memory --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_science_memory import rebuild
          d=json.loads(Path('docs/lab/v6-memory.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_SCIENCE_MEMORY_SHADOW_WARMUP_NOT_VALIDATED'
          assert d['source_forecasts']==d['stream_records']['observations']
          assert d['source_forecasts']==d['stream_records']['patterns']
          assert d==rebuild('.')
          print('V6_FIVE_MEMORIES_REPLAY_OK',d['source_forecasts'])
          PY
      - name: V6 falsification smoke with real frozen journal and scientific memory
        run: |
          python -m scripts.lab_v6_falsification
          python -m scripts.lab_v6_falsification --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/v6-falsification.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_FALSIFICATION_SHADOW_NO_PROMOTION'
          assert len(d['checks'])==10
          assert len(set(x['code'] for x in d['checks']))==10
          assert set(x['result'] for x in d['checks'])<= {'PASS','FAIL','INSUFFICIENT_N'}
          assert d['overall']=='INCONCLUSIVO'
          print('V6_FALSIFICATION_REAL_SOURCE_OK',d['sample'])
          PY
      - name: V6 FT evidence journal and bounded priority smoke (real ledger, no API)
        run: |
          python -m scripts.lab_v6_ft_events
          python -m scripts.lab_v6_ft_events --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_ft_events import read_events, validate_against_ledger
          l=json.loads(Path('data/lab/ft-ledger.json').read_text(encoding='utf-8'))
          d=json.loads(Path('docs/lab/v6-ft-evidence.json').read_text(encoding='utf-8'))
          records=read_events('.')
          assert validate_against_ledger(records,l)
          assert d['status']=='V6_FT_EVIDENCE_SHADOW_NOT_CERTIFIED'
          assert d['events_total']==len(records)
          assert d['confirmed_scores']==sum(x['status']=='FINAL' for x in l['matches'].values())
          assert d['matches']==len(l['matches'])
          print('V6_FT_ALL_MATCHES_REAL_INPUT_OK',d['matches'],d['events_total'])
          PY
      - name: V4 revision real-data migration and replay smoke (temporary root)
        run: |
          python - <<'PY'
          import json
          import shutil
          import tempfile
          from pathlib import Path
          from h1lab.market_v4 import store
          from h1lab.v4_revisions import read_events, verify_projection
          from scripts.lab_v4_revisions import main
          with tempfile.TemporaryDirectory() as tmp:
              folder=Path(tmp)/'data/lab'
              folder.mkdir(parents=True)
              for file in Path('data/lab').glob('markets-????-??.jsonl'):
                  shutil.copyfile(file,folder/file.name)
              # Never manufacture earlier revisions from the latest view.
              store(tmp, [])
              d=main(['--root',tmp])
              main(['--root',tmp,'--verify-only'])
              assert verify_projection(tmp)
              assert d['messages']>0
              assert d['kinds']['HISTORICAL_BASELINE_IMPORT']==d['messages']
              assert d['revision_events']==len(read_events(tmp))
              print('V4_REVISION_REAL_MIGRATION_OK',d['messages'])
          PY
      - name: V6.2 Scientific Radar proof and real-data smoke
        run: |
          python -m scripts.lab_v6_scientific_radar
          python -m scripts.lab_v6_scientific_radar --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/v6-scientific-radar.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_SCIENTIFIC_RADAR_SHADOW_NOT_VALIDATED'
          assert 1<=d['active_hypotheses']<=10
          assert all(h['state']!='VALIDADO' for h in d['hypotheses'])
          assert d['totals']['unique_matches']==sum(len(h['games']) for h in d['hypotheses'])
          assert all(x['forecast']['sha256'] and x['forecast']['memory_observation_sha256']
                     and x['forecast']['memory_pattern_sha256'] for h in d['hypotheses'] for x in h['games'])
          assert all(x['source_v4']['status']!='V4_VERSION_VERIFIED_BEFORE_FREEZE' or
                     x['source_v4']['known_at']<=x['frozen_known_at']
                     for h in d['hypotheses'] for x in h['games'])
          print('V6_SCIENTIFIC_RADAR_PROOF_OK',d['totals']['unique_matches'])
          PY
      - name: Scientific Radar browser syntax
        run: node --check docs/scientific-radar.js
      - name: "Weekly V6.2 drift monitor: source, fixed thresholds and replay"
        run: |
          python -m scripts.lab_v6_weekly_monitor
          python -m scripts.lab_v6_weekly_monitor --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_weekly_monitor import STATUS
          from scripts.lab_v6_weekly_monitor import read_snapshots
          root=Path('.')
          d=json.loads((root/'docs/lab/v6-weekly-drift.json').read_text(encoding='utf-8'))
          e=read_snapshots(root)
          assert d['status']==STATUS
          assert d['latest_monitor_week']==e[-1]['monitor_week']
          assert d['latest_snapshot_at']==e[-1]['report']['as_of']
          assert d['last_sha256']==e[-1]['sha256']
          assert d['latest']['overall'] in (
              'INSUFFICIENT_HISTORY','PARTIALLY_EVALUATED_NO_ALERT','SUSPECTED_DRIFT_REVIEW')
          assert all(w['period']=='COMPLETED' for w in d['latest']['weeks']
                     if w['week']!=d['latest']['monitor_week'])
          print('V6_WEEKLY_DRIFT_REAL_SOURCES_OK',d['latest_monitor_week'],
                'source_forecasts',d['latest']['input']['forecasts_total'])
          PY
      - name: Validate external five-minute cron fallback
        run: node --test scheduler/worker.test.mjs
