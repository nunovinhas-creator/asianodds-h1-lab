name: CI — test H1 calculations
on:
  push:
    paths:
      - "h1lab/**"
      - "scripts/**"
      - "tests/**"
      - "scheduler/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q h1lab scripts
      - run: python -m unittest discover -s tests -v
      - name: V6 all-hypothesis market residual smoke (no API / no push)
        run: |
          python -m scripts.lab_v6_residual
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/v6-residual-research.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_EXPLORATORY_MARKET_RELATIVE_NO_BETS'
          assert len(d['all_hypotheses'])==d['generation']['hypotheses_evaluated']
          assert all(x['btts_yes_vs_market']['state']=='MODEL_REFERENCE_NOT_AVAILABLE'
                     for x in d['all_hypotheses'])
          assert d['method']['freeze_or_validate'] is False
          print('V6_RESIDUAL_REAL_INPUT_OK',len(d['all_hypotheses']))
          PY
      - name: V6 smoke using real repository snapshots (no API / no push)
        run: |
          python -m scripts.lab_v6_shadow
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_shadow import read_journal
          root=Path('.')
          report=json.loads((root/'docs/lab/v6-shadow.json').read_text(encoding='utf-8'))
          prices=json.loads((root/'docs/lab/v6-price-quality.json').read_text(encoding='utf-8'))
          assert report['hypothesis']['state'] in ('INCONCLUSIVO','VALIDADO')
          assert prices['scope']=='HISTORICAL_PRICE_QA_NOT_FORECASTS'
          assert len(prices['snapshots'])==report['price_quality_historical']['total_snapshots']
          assert len(read_journal(root))==report['forecasts']['records']
          rd=json.loads((root/'docs/lab/v6-readiness.json').read_text(encoding='utf-8'))
          assert rd['status']=='V6_COVERAGE_OBSERVABILITY_NOT_MODEL_VALIDATION'
          assert rd['records']==report['forecasts']['records']
          assert rd['p0_7_day_gate'] in ('WARMUP','SOURCE_COVERAGE_PASS_PENDING_EXTERNAL_VERIFICATION','SOURCE_COVERAGE_BELOW_99_PERCENT')
          print('V6_REAL_INPUT_SMOKE_OK',len(prices['snapshots']))
          PY
      - name: V6 scientific memory replay smoke on real frozen snapshots
        run: |
          python -m scripts.lab_v6_memory
          python -m scripts.lab_v6_memory --verify-only
          python - <<'PY'
          import json
          from pathlib import Path
          from h1lab.v6_science_memory import rebuild
          d=json.loads(Path('docs/lab/v6-memory.json').read_text(encoding='utf-8'))
          assert d['status']=='V6_SCIENCE_MEMORY_SHADOW_WARMUP_NOT_VALIDATED'
          assert d['source_forecasts']==d['stream_records']['observations']
          assert d['source_forecasts']==d['stream_records']['patterns']
          assert d==rebuild('.')
          print('V6_FIVE_MEMORIES_REPLAY_OK',d['source_forecasts'])
          PY
      - name: Validate external five-minute cron fallback
        run: node --test scheduler/worker.test.mjs
