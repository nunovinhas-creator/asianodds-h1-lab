name: Lab - V4 log retrieval diagnostic (PR)
on:
  pull_request:
    paths:
      - "scripts/lab_v4_audit.py"
      - ".github/workflows/lab-v4-log-diagnostic.yml"
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect metadata-only log retrieval result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from scripts.lab_v4_audit import scan_run
          for rid in (40548112773,40547324854):
              result=scan_run(rid,os.environ['GITHUB_TOKEN'])
              print('AUDIT_LOG_DIAG',json.dumps(result,sort_keys=True))
          PY
