name: V6 - Offline LLM statistics (research only)
# ``ft:<id>`` names the FT run a run is about (workflow_run upstream or FT-requested dispatch):
# the activation gate refuses a second run for the same FT run (DUPLICATE_FT_SOURCE).
run-name: >-
  V6 offline statistics (${{ github.event_name }}${{ github.event.workflow_run.id && format(' ft:{0}', github.event.workflow_run.id) || '' }}${{ inputs.ft_source_run_id && format(' ft:{0}', inputs.ft_source_run_id) || '' }})
on:
  pull_request:
  # Primary trigger: a SUCCESSFUL FT reconciliation on main (the input that moves the report).
  # Only event metadata is read; nothing from the upstream run is checked out or executed.
  workflow_run:
    workflows: ["Lab - Reconcile FT for all observed matches"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Excecao manual auditada: ignora a janela de 6 h (exige reason)"
        required: false
        type: boolean
        default: false
      reason:
        description: "Motivo obrigatorio quando force=true (fica no resumo e numa anotacao)"
        required: false
        type: string
        default: ''
      # Set only by lab-ft-results.yml (job request-v6) for FT runs started with GITHUB_TOKEN,
      # whose completion GitHub never turns into a workflow_run. Verified by the gate via the
      # API (completed, success, main, this repository, github-actions[bot]); never with force.
      ft_source_run_id:
        description: "Run ID do FT de origem (pedido automatico do FT; verificado pelo gate)"
        required: false
        type: string
        default: ''
  # Reserve only: the activation gate lets it compute when no attempt happened in 6 h.
  schedule:
    - cron: '18 2,8,14,20 * * *'
permissions:
  contents: read
# Workflow-level mutex: covers gate -> evaluate -> publish of a run, so the next run's gate
# decides only after this run has published (or failed). Never cancels an active run.
concurrency:
  group: v6-offline-statistics-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # Trusted code only: the default-branch commit (or the PR merge commit for CI).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Activation gate (inside the mutex; revalidates main and attempt history now)
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v6_activation_gate
      - name: Non-binding preview of the scheduled decision on main (PR CI only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.v6_activation_gate --dry-run-as schedule
  evaluate:
    needs: gate
    # Second, independent guard on the upstream metadata in addition to the gate decision.
    if: >-
      ${{ needs.gate.outputs.run == 'true' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.event != 'pull_request' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # 'true' ONLY when a real evaluation was computed; publish requires it.
      evaluated: ${{ steps.replay.outcome == 'success' && steps.science.outputs.state == 'AUTHORISED' }}
      scientific_state: ${{ steps.science.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic adversarial tests (no network)
        run: python -m unittest tests.test_v6_offline_statistics -v
      # Technical integrity and classification of the P0 gate. Unknown, accepted or corrupt
      # states FAIL here; a known blocking state (e.g. 7-day BELOW_99_PERCENT) is reported.
      - name: Scientific gate (technical integrity; unknown states fail)
        id: science
        run: python -m scripts.v6_scientific_gate --github-output
      - name: SCIENTIFICALLY_BLOCKED - verify no evaluation and no writes
        if: ${{ steps.science.outputs.state == 'SCIENTIFICALLY_BLOCKED' }}
        run: |
          python -m scripts.v6_scientific_gate --verify-blocked
          echo "::notice title=V6_SCIENTIFICALLY_BLOCKED::P0 gate blocks research use; no statistical evaluation was performed and nothing will be published"
          { echo '### V6 offline statistics: SCIENTIFICALLY_BLOCKED';
            echo 'No evaluation performed, no report produced, publication disabled. Threshold unchanged (99 %).'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Real historical replay and source immutability
        id: replay
        if: ${{ steps.science.outputs.state == 'AUTHORISED' }}
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          from h1lab.v6_offline_statistics import build
          from scripts.lab_v6_offline_statistics import main
          paths=[p for p in Path('data').rglob('*') if p.is_file()]
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          report=main(['--now',now])
          assert report==build(Path('.'),now=datetime.fromisoformat(now))
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in before.items())
          assert report['llm_calls']==0 and report['validated']==0
          assert all(not h['scientifically_proven'] for h in report['hypotheses'])
          print('REAL_REPLAY_OK',report['coverage'],report['catalogue_support']['counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ steps.replay.outcome == 'success' }}
        with:
          name: offline-llm-statistics-${{ github.run_id }}
          path: docs/lab/llm-statistics.json
          retention-days: 14
  publish:
    needs: evaluate
    # Never publish without a real evaluation (e.g. SCIENTIFICALLY_BLOCKED produces none).
    if: ${{ needs.evaluate.outputs.evaluated == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      # Pinned to the exact commit the evaluate job computed on (the report's input commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: offline-llm-statistics-${{ github.run_id }}
          path: ${{ runner.temp }}/statistics
      - name: Publish research report and immutable run history (no rebase, no force push)
        env:
          RUN_ID: ${{ github.run_id }}
          V6_INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V6_INPUT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/lab/llm-statistics-runs
          if [ -e "docs/lab/llm-statistics-runs/$RUN_ID.json" ]; then
            echo "::notice title=V6_OFFLINE_STATS_ALREADY_PUBLISHED::run history $RUN_ID already on the input commit; never overwritten"
            exit 0
          fi
          cp "$RUNNER_TEMP/statistics/llm-statistics.json" docs/lab/llm-statistics.json
          cp docs/lab/llm-statistics.json "docs/lab/llm-statistics-runs/$RUN_ID.json"
          git add docs/lab/llm-statistics.json "docs/lab/llm-statistics-runs/$RUN_ID.json"
          git commit -q -m "data(llm): offline statistical audit $RUN_ID [skip ci]" -m "V6-Input-Commit: $V6_INPUT_SHA"
          # Concurrent collector/H1/FT/V4/LLM commits are classified path by path: unrelated
          # paths are kept byte-for-byte, a valid change of a V6 input triggers an offline
          # recomputation on the exact remote inputs, incompatible changes refuse, program
          # changes supersede safely. Bounded CAS retries; never rebase, never force push.
          python -m scripts.lab_v6_offline_publish_safe --base "$V6_INPUT_SHA" --run-id "$RUN_ID" \
            --receipt "$RUNNER_TEMP/v6-offline-publish-receipt.json" \
            --bundle "$RUNNER_TEMP/v6-offline-unpublished.bundle"
      - name: Verifiable publication receipt
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/v6-offline-publish-receipt.json" ]; then
            { echo '### V6 offline statistics publication receipt'; echo '```json';
              cat "$RUNNER_TEMP/v6-offline-publish-receipt.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-offline-publish-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v6-offline-publish-receipt.json
            ${{ runner.temp }}/v6-offline-unpublished.bundle
          if-no-files-found: ignore
          retention-days: 30
