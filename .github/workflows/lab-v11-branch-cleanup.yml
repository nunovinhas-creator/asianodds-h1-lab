name: LAB - One-time merged V11 branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-v11-branch-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Delete only three verified merged LAB branches then self-remove
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [lab/api-football-activation-20261028]=ffc1d62b82f7cc30c668de42c07fc62d0d204220
            [lab/api-secret-name-20261028]=a8b99e91ffed9cfab41b7406296a6ce23ddd0992
            [lab/openfoot-ft-probe-20261028]=a54e3c65296434f1495e0d1d3289f2dcefdfb9a1
          )
          for branch in "${!expected[@]}"; do
            head="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [[ "$head" != "${expected[$branch]}" ]]; then
              echo "CHANGED_BRANCH_ABORT $branch"
              exit 1
            fi
          done
          for branch in "${!expected[@]}"; do
            git push origin --delete "$branch"
            echo "DELETED_MERGED_LAB $branch"
          done
          branches="$(git ls-remote --heads origin | sed 's/.*refs\/heads\///' | sort)"
          test "$branches" = "$(printf 'feature/bsd-europa-audit\nmain')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lab-v11-branch-cleanup.yml
          git commit -m 'chore(lab): remove temporary V11 branch cleanup [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo V11_BRANCH_CLEANUP_COMPLETE
              exit 0
            fi
            sleep 2
          done
          echo V11_BRANCH_CLEANUP_SELF_REMOVAL_FAILED
          exit 1
