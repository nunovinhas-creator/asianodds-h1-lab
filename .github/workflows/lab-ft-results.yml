name: Lab - Reconcile FT for all observed matches
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origem manual ou watchdog H1 (apenas fallback)"
        required: false
        type: string
        default: manual
  schedule:
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - 'h1lab/lab_results.py'
      - 'h1lab/lab_ft_evidence.py'
      - 'tests/test_lab_ft_v7.py'
      - 'h1lab/lab_ft_crosswalk.py'
      - 'h1lab/lab_ft_dual_consensus.py'
      - 'h1lab/lab_ft_attestations.py'
      - 'data/lab/ft-provider-attestations.json'
      - 'h1lab/lab_bsd_payload.py'
      - 'tests/test_lab_bsd_payload.py'
      - 'tests/test_lab_ft_dual_consensus.py'
      - 'h1lab/lab_goal_id_probe.py'
      - 'tests/test_lab_goal_id_probe.py'
      - 'h1lab/lab_ft_rotation.py'
      - 'tests/test_lab_ft_rotation.py'
      - 'h1lab/lab_ft_backlog.py'
      - 'h1lab/lab_fotmob.py'
      - 'h1lab/lab_api_football.py'
      - 'h1lab/lab_api_football_errors.py'
      - 'h1lab/lab_api_football_access.py'
      - 'tests/test_lab_api_football_access.py'
      - 'tests/test_lab_api_football_diagnostics.py'
      - 'h1lab/lab_api_football_reviewed.py'
      - 'h1lab/lab_ft_day_identity.py'
      - 'tests/test_lab_ft_day_identity.py'
      - 'tests/test_lab_api_football_reviewed.py'
      - 'data/lab/ft-api-football-reviewed.json'
      - 'h1lab/lab_goal.py'
      - 'h1lab/lab_goal_reviewed.py'
      - 'data/lab/ft-goal-reviewed.json'
      - 'tests/test_lab_goal_reviewed.py'
      - 'h1lab/lab_openfoot.py'
      - 'tests/test_lab_goal_openfoot.py'
      - 'tests/test_lab_api_football.py'
      - 'tests/test_lab_fotmob.py'
      - 'h1lab/lab_ft_diagnostics.py'
      - 'h1lab/lab_identity_review.py'
      - 'tests/test_lab_identity_review.py'
      - 'tests/test_lab_ft_diagnostics.py'
      - 'scripts/lab_results.py'
      - 'tests/test_lab_results.py'
      - 'tests/test_lab_ft_fair_queue.py'
      - 'h1lab/lab_ft_backlog.py'
      - 'h1lab/lab_espn.py'
      - 'h1lab/lab_sportscore.py'
      - 'h1lab/lab_monte_bsd.py'
      - 'h1lab/lab_bsd_priority.py'
      - 'tests/test_lab_bsd_monte_first.py'
      - 'h1lab/lab_reviewed_bsd_ids.py'
      - 'tests/test_lab_reviewed_bsd_ids.py'
      - 'tests/test_lab_monte_bsd.py'
      - 'h1lab/lab_reviewed_aliases.py'
      - 'h1lab/lab_ft_reviewed_evidence.py'
      - 'tests/test_lab_ft_reviewed_evidence.py'
      - 'tests/test_lab_ft_overdue_reviews.py'
      - 'tests/test_lab_reviewed_aliases.py'
      - 'tests/test_lab_source_order.py'
      - 'tests/test_lab_ft_recovery.py'
      - 'tests/test_lab_sportscore.py'
      - 'tests/test_lab_espn.py'
      - 'h1lab/lab_bsd_search.py'
      - 'tests/test_lab_bsd_search.py'
      - 'h1lab/lab_identity.py'
      - 'tests/test_lab_identity.py'
      - 'h1lab/pattern_engine.py'
      - 'h1lab/pattern_features.py'
      - 'h1lab/market_math.py'
      - 'h1lab/similarity.py'
      - 'h1lab/lab_stats.py'
      - 'scripts/lab_pattern_research.py'
      - 'tests/test_pattern_engine.py'
      - 'h1lab/discovery_timeline.py'
      - 'scripts/lab_discoveries.py'
      - 'tests/test_discovery_timeline.py'
      - 'h1lab/pattern_watch.py'
      - 'scripts/lab_pattern_watch.py'
      - 'tests/test_pattern_watch.py'
      - 'docs/lab-research.html'
      - 'docs/lab-pattern-watch.html'
      - '.github/workflows/lab-ft-results.yml'

permissions:
  contents: write

# Separate from asianodds-h1-write and from V4 auditing; no H1 delay.
concurrency:
  group: asianodds-lab-ft-results
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read most recent LAB/H1 input snapshots
        run: git pull --rebase origin main
      - name: Check independent result reconciliation
        run: |
          python -m unittest discover -s tests -p 'test_lab_results.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_v7.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_fair_queue.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_dual_consensus.py' -v
          python -m unittest discover -s tests -p 'test_lab_bsd_payload.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_rotation.py' -v
          python -m unittest discover -s tests -p 'test_lab_goal_id_probe.py' -v
          python -m unittest discover -s tests -p 'test_lab_goal_reviewed.py' -v
          python -m unittest discover -s tests -p 'test_lab_fotmob.py' -v
          python -m unittest discover -s tests -p 'test_lab_api_football.py' -v
          python -m unittest discover -s tests -p 'test_lab_api_football_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_lab_api_football_access.py' -v
          python -m unittest discover -s tests -p 'test_lab_api_football_reviewed.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_day_identity.py' -v
          python -m unittest discover -s tests -p 'test_lab_goal_openfoot.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_lab_identity_review.py' -v
          python -m unittest discover -s tests -p 'test_lab_bsd_search.py' -v
          python -m unittest discover -s tests -p 'test_lab_espn.py' -v
          python -m unittest discover -s tests -p 'test_lab_sportscore.py' -v
          python -m unittest discover -s tests -p 'test_lab_reviewed_aliases.py' -v
          python -m unittest discover -s tests -p 'test_lab_source_order.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_recovery.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_reviewed_evidence.py' -v
          python -m unittest discover -s tests -p 'test_lab_ft_overdue_reviews.py' -v
          python -m unittest discover -s tests -p 'test_lab_monte_bsd.py' -v
          python -m unittest discover -s tests -p 'test_lab_bsd_monte_first.py' -v
          python -m unittest discover -s tests -p 'test_lab_identity.py' -v
          python -m unittest discover -s tests -p 'test_lab_reviewed_bsd_ids.py' -v
      - name: Reconcile all observed fixture identities (bounded, no betting)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL || secrets.API_FOOTBALL_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          LAB_FOTMOB_LICENSED: ${{ vars.LAB_FOTMOB_LICENSED || '0' }}
          LAB_API_FOOTBALL_SCHEDULED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'h1-ft-watchdog') }}
          LAB_FT_WATCHDOG_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source == 'h1-ft-watchdog' }}
          LAB_FT_BACKLOG_ONCE_20261028: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ft-recovery-v12-once]') }}
          LAB_RESULTS_MAX_CHECKS: ${{ vars.LAB_RESULTS_MAX_CHECKS || '30' }}
          LAB_BSD_DATE_MAX_DAYS: ${{ vars.LAB_BSD_DATE_MAX_DAYS || '3' }}
          LAB_BSD_DATE_MAX_PAGES: ${{ vars.LAB_BSD_DATE_MAX_PAGES || '3' }}
        run: python -m scripts.lab_results
      # P1 #9: append-only FT transition/evidence stream for ALL LAB games.
      # Uses the already reconciled ledger; no provider requests.
      - name: Journal all FT changes and verify chain (V6 shadow)
        id: v6_ft_events
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_ft_events.py' -v
          python -m scripts.lab_v6_ft_events
          python -m scripts.lab_v6_ft_events --verify-only
      - name: Validate published snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/ft-results.json').read_text())
          ledger=json.loads(Path('data/lab/ft-ledger.json').read_text())
          assert d['status']=='LAB_FT_OBSERVATION_ONLY_NOT_CERTIFIED'
          assert sum(d['status_counts'].values())==d['matches']
          assert d['final_recorded']+d['unverified']==d['matches']
          assert all(x['match_key'] in ledger['matches'] for x in d['games'])
          assert all(x.get('home_goals') is None for x in d['games'] if x['status']!='FINAL')
          assert d['matches_omitted_from_display']+d['displayed_matches']==d['matches']
          b=json.loads(Path('docs/lab/ft-backlog.json').read_text())
          assert b['status']=='FT_BACKLOG_AUDIT_OBSERVATION_ONLY'
          assert b['total_matches']==d['matches']
          assert b['classification'].get('verified_ft',0)==d['final_recorded']
          assert sum(b['classification'].values())-b['classification'].get('past_due_never_checked',0)-b['classification'].get('past_due_expired',0)==d['matches']
          assert b['classification'].get('past_due_unverified',0)==d['coverage_diagnostics']['past_unverified_eligible']
          assert b['overdue_omitted']==0
          assert d['ft_queue']['never_checked_deferred'] >= 0
          assert d['ft_queue']['provider_id_collisions'] >= 0
          registry=json.loads(Path('docs/lab/ft-provider-identity.json').read_text())
          assert registry['schema_version']==1
          assert registry['confirmed_ids'] == d['ft_queue']['confirmed_provider_ids']
          for provider, value in d['ft_queue']['date_rotation'].items():
              assert len(value['requested_days']) <= value['date_budget']
              assert set(value['requested_days']).issubset(value['selected_days'])
          att=json.loads(Path('data/lab/ft-provider-attestations.json').read_text())
          assert att['schema_version']==1 and isinstance(att['records'],dict)
          assert isinstance(att['conflicts'],dict)
          assert sum(len(v) for v in att['records'].values()) <= 5000
          from h1lab.lab_ft_attestations import seal
          for key, by_provider in att['records'].items():
              assert key in ledger['matches']
              for provider, proof in by_provider.items():
                  assert proof['match_key']==key
                  assert proof['provider']==provider
                  assert seal(proof)['sha256']==proof['sha256']
          assert d['ft_queue']['selected'] <= 30
          assert d['ft_queue']['selected'] + d['ft_queue']['deferred_by_capacity'] == d['ft_queue']['eligible']
          print('LAB_FT_BACKLOG_VALID',b['classification'].get('past_due_unverified',0),
                b['classification'].get('past_due_never_checked',0))

          c=d['coverage_diagnostics']
          assert c['ft_confirmed']+c['future']+c['grace']+c['blocked_review']+c['past_unverified_eligible']==d['matches']
          assert sum(d["timing_counts"].values())==d["matches"]
          assert d["espn_scoreboards"]["requests"] <= 12
          assert d['monte_carlos_bsd']['bsd_direct_event_requests'] <= 12
          assert d['fotmob_search']['requests'] <= 3
          assert d['api_football_search']['requests'] <= 3
          assert d['api_football_search']['id_requests'] <= 1
          assert d['api_football_search']['date_requests'] + d['api_football_search']['id_requests'] == d['api_football_search']['requests']
          assert d['goal_search']['requests'] <= 2
          assert d['goal_search']['requests'] == d['goal_search']['date_requests'] + d['goal_search']['id_requests']
          assert d['ft_queue']['goal_id_probe']['calls'] <= 1
          assert d['openfoot_search']['requests'] <= 2
          assert d['fotmob_search']['verified_in_run'] <= 30
          assert d['monte_carlos_bsd']['verified_core_name_in_run'] <= d['monte_carlos_bsd']['core_name_event_id_candidates']
          assert d['reviewed_bsd_id_catalog_matches'] <= 5
          assert d["sportscore_search"]["requests"] <= 45
          assert d["sportscore_search"]["targeted_searches"] <= 20
          assert d["reviewed_alias_catalog_matches"] <= 16
          assert d["thesportsdb_search"].get("requested",0) <= 30
          assert d['bsd_date_search']['date_days_examined'] <= 4
          assert d['bsd_date_search']['date_list_requests'] <= 16
          assert Path('docs/lab/ft-results.json').stat().st_size < 400000
          print('LAB_FT_SUMMARY_VALID', d['matches'], d['final_recorded'], d['status_counts'])
          PY
      # P2#13: FT-blind observational pruning; preserve existing pipelines.
      - name: Freeze and replay V6.2 P2#13 (shadow)
        id: v6_pruning
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_hypothesis_pruning.py' -v
          python -m scripts.lab_v6_hypothesis_pruning
          python -m scripts.lab_v6_hypothesis_pruning --verify-only
      # LAB V5 research engine. Runs right after new FT results, reuses the
      # feature cache (outside git) and can never block FT publication.
      - name: Restore research feature cache
        uses: actions/cache/restore@v4
        with:
          path: data/lab/.cache
          key: lab-pattern-cache-${{ github.run_id }}
          restore-keys: lab-pattern-cache-
      - name: Update pattern research (exploratory, no betting)
        id: research
        continue-on-error: true
        env:
          LAB_SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m unittest discover -s tests -p 'test_pattern_engine.py'
          python -m scripts.lab_pattern_research
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/pattern-research.json').read_text())
          reg=json.loads(Path('data/lab/pattern-registry.json').read_text())
          assert d['status']=='LAB_EXPLORATORY_RESEARCH_NOT_BETTING'
          assert set(d['state_counts'])<=set(['EXPLORATORIO','CANDIDATO','EM_VALIDACAO','VALIDADO','REJEITADO'])
          assert {f['id'] for f in d['frozen']}<= {e['id'] for e in reg['entries']}
          assert Path('docs/lab/pattern-research.json').stat().st_size < 350000
          print('LAB_PATTERN_SUMMARY_VALID', d['scope']['ft_confirmed'], d['state_counts'])
          PY
      - name: Save research feature cache
        if: steps.research.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/lab/.cache
          key: lab-pattern-cache-${{ github.run_id }}
      # ALL V5 hypotheses, not only the published top-40, against the
      # quality-vetted Total market model. Historical/descriptive ONLY.
      - name: Evaluate V6 market residual for all hypotheses (shadow)
        id: v6_residual
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_residual.py' -v
          python -m scripts.lab_v6_residual
      - name: Refresh prospective V5 movement watch (no API, no betting)
        id: prospective
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_pattern_watch.py' -v
          python -m scripts.lab_pattern_watch
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/pattern-watch.json').read_text(encoding='utf-8'))
          history=json.loads(Path('data/lab/pattern-watch-first-seen.json').read_text(encoding='utf-8'))
          assert d['status']=='PROSPECTIVE_OBSERVATION_NOT_VALIDATED_NOT_BETTING'
          assert len(d['future_strict'])==d['summary']['strict_eligible']
          assert len(history['entries'])==d['summary']['total_historical_first_detections']
          assert all(x['strict_condition'] and x['original_condition'] for x in d['future_strict'])
          assert all(x['episodes']>=2 and x['messages']==x['valid_total_messages']
                     and x['category'] in ('RISING_EACH_EPISODE','RISING_WITH_FLAT','FLAT_EACH_EPISODE')
                     for x in d['future_strict'])
          assert Path('docs/lab/pattern-watch.json').stat().st_size<180000
          print('V5_WATCH_VALID',d['summary'])
          PY
      - name: Update MASTER BRAIN discovery chronology (no API / no betting)
        id: discovery
        if: steps.research.outcome == 'success' && steps.prospective.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_discovery_timeline.py' -v
          python -m scripts.lab_discoveries
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/lab/discoveries.json').read_text(encoding='utf-8'))
          s=json.loads(Path('data/lab/discovery-state.json').read_text(encoding='utf-8'))
          assert d['status']=='DISCOVERY_OBSERVATION_NOT_BETTING'
          assert len(d['patterns'])==len(s['patterns'])
          assert d['prospective']['settled_total']==len(s['prospective_settled'])
          assert len(d['timeline']) <= 90
          assert all(x['at_utc'] >= d['baseline_at'] for x in d['timeline'])
          print('MASTER_BRAIN_DISCOVERY_VALID', len(d['timeline']), d['prospective']['settled_total'])
          PY
      - name: Commit only LAB FT artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lab/ft-ledger.json docs/lab/ft-results.json docs/lab/ft-backlog.json
          git add data/lab/ft-provider-day-rotation.json data/lab/ft-provider-identity.json docs/lab/ft-provider-identity.json
          git add -f data/lab/ft-provider-attestations.json
          if [ -f data/lab/ft-api-football-day-index.json ]; then git add data/lab/ft-api-football-day-index.json; fi
          if [ -f docs/lab/ft-identity-review.json ]; then git add docs/lab/ft-identity-review.json; fi
          if [ -f docs/lab/ft-api-football-review-decisions.json ]; then git add docs/lab/ft-api-football-review-decisions.json; fi
          if [ "${{ steps.v6_ft_events.outcome }}" = "success" ]; then
            git add -f data/lab/v6-ft-events-*.jsonl 2>/dev/null || true
            if [ -f docs/lab/v6-ft-evidence.json ]; then git add docs/lab/v6-ft-evidence.json; fi
          fi
          if [ -f data/lab/ft-api-audit.json ]; then git add data/lab/ft-api-audit.json; fi
          if [ -f docs/lab/pattern-research.json ]; then git add docs/lab/pattern-research.json; fi
          if [ -f docs/lab/v6-residual-research.json ]; then git add docs/lab/v6-residual-research.json; fi
          if [ "${{ steps.v6_pruning.outcome }}" = "success" ]; then
            git add -f data/lab/v6-pruning-selection-v1.json
            git add docs/lab/v6-pruning.json
          fi
          if [ -f data/lab/pattern-registry.json ]; then git add data/lab/pattern-registry.json; fi
          if [ -f docs/lab/pattern-watch.json ]; then git add docs/lab/pattern-watch.json; fi
          if [ -f data/lab/pattern-watch-first-seen.json ]; then git add data/lab/pattern-watch-first-seen.json; fi
          if [ -f data/lab/discovery-state.json ]; then git add data/lab/discovery-state.json; fi
          if [ -f docs/lab/discoveries.json ]; then git add docs/lab/discoveries.json; fi
          git add -f data/lab/discovery-events-*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo LAB_FT_NO_CHANGE
            exit 0
          fi
          git commit -m 'data(lab): reconcile observed match FT [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo LAB_FT_PUBLISHED
              exit 0
            fi
            sleep 2
          done
          echo LAB_FT_PUBLISH_FAILED
          exit 1
