name: V6 - Investigator LLM dossier (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolated investigator contract
        run: python -m unittest discover -s tests -p 'test_v6_llm_investigator.py' -v
      - name: Prepare bounded research dossier without external LLM requests
        run: |
          mkdir -p "$RUNNER_TEMP/v6-llm"
          python -m scripts.lab_v6_llm_investigator --mode dossier > "$RUNNER_TEMP/v6-llm/dossier.json"
          python -m json.tool "$RUNNER_TEMP/v6-llm/dossier.json" > /dev/null
      - name: Upload offline dossier for human review
        uses: actions/upload-artifact@v4
        with:
          name: v6-llm-investigator-dossier
          path: \${{ runner.temp }}/v6-llm/dossier.json
          retention-days: 7
