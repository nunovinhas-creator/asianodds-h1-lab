name: Testar destino Telegram Bot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Send one Telegram destination test
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          from h1lab.bot import send_message
          send_message("✅ MASTER BRAIN — teste de ligação ao bot concluído. Só as novas observações rigorosas do padrão prospetivo serão notificadas neste chat; Under H1 e triplas estão silenciados.")
          print("BOT_SMOKE_SUCCESS: Telegram confirmed message delivery to configured chat")
          PY
