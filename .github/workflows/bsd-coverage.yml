name: Auditar cobertura BSD nos jogos H1
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bsd-coverage.yml"
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query BSD for exact H1 fixture identity without settling
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlencode
          from datetime import datetime, timezone
          from h1lab.cli import read_state
          from h1lab.bsd import ROOT, request_json, BSDProviderError, matches_identity

          token=os.environ.get("BSD_API_KEY","").strip()
          if not token:
              raise SystemExit("BSD_SECRET_MISSING")
          signals=read_state().get("signals",[])[:16]
          counts={"exact":0,"missing":0,"ambiguous":0,"incomplete":0,"provider_error":0}
          print("BSD_COVERAGE_SIGNALS:",len(signals))
          for s in signals:
              date=datetime.fromisoformat(s["kickoff_utc"]).astimezone(timezone.utc).date().isoformat()
              url=ROOT+"?"+urlencode({"team_name":s["home"],"date_from":date,"date_to":date,"limit":200})
              try:
                  data=request_json(url,token)
                  if not isinstance(data,dict) or not isinstance(data.get("results"),list):
                      outcome="incomplete"
                  elif data.get("next"):
                      outcome="incomplete"
                  else:
                      candidates=[e for e in data["results"] if matches_identity(s,e)]
                      outcome="exact" if len(candidates)==1 else "ambiguous" if len(candidates)>1 else "missing"
              except BSDProviderError:
                  outcome="provider_error"
              counts[outcome]+=1
              print("BSD_FIXTURE",s["home"],"vs",s["away"],date,outcome)
          print("BSD_COVERAGE_SUMMARY",counts)
          # A broader, date-only search detects fixtures lost by fuzzy
          # team_name indexing, but still requires exact identities.
          unknown=[s for s in signals if True]
          all_by_date={}
          for day in sorted({datetime.fromisoformat(s["kickoff_utc"]).date().isoformat() for s in unknown}):
              rows=[]
              for offset in (0,200,400):
                  url=ROOT+"?"+urlencode({"date_from":day,"date_to":day,"limit":200,"offset":offset})
                  try:
                      payload=request_json(url,token)
                  except BSDProviderError:
                      print("BSD_DATE_SEARCH_UNAVAILABLE",day)
                      break
                  if not isinstance(payload,dict) or not isinstance(payload.get("results"),list):
                      break
                  rows+=payload["results"]
                  if not payload.get("next"):
                      break
              all_by_date[day]=rows
          found=0
          for s in signals:
              day=datetime.fromisoformat(s["kickoff_utc"]).date().isoformat()
              matches=[e for e in all_by_date.get(day,[]) if matches_identity(s,e)]
              state="exact" if len(matches)==1 else "ambiguous" if len(matches)>1 else "missing"
              print("BSD_DATE_FIXTURE",s["home"],"vs",s["away"],state)
              found+=state=="exact"
          print("BSD_DATE_COVERAGE_EXACT:",found,"of",len(signals))
          PY
