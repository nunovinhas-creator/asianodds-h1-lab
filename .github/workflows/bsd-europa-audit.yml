name: LAB - BSD Europe 30 manual coverage audit

on:
  workflow_dispatch:
    inputs:
      confirm_request_budget:
        description: 'Confirmar despesa de aproximadamente 236 pedidos BSD nesta auditoria manual'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bsd-europa-audit-manual
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm_request_budget == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic tests (no network)
        run: python -m unittest tests.test_bsd_europa_audit -v
      - name: Read-only BSD coverage audit (not H1 or production)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          set -o pipefail
          python -m tools.bsd_europa_audit bsd-europa-audit.json 2>&1 | tee bsd-europa-audit.log
      - name: Upload audit artifact for manual inspection only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-europa-audit
          path: |
            bsd-europa-audit.json
            bsd-europa-audit.log
          if-no-files-found: warn
          retention-days: 30
