name: Auditar cobertura BSD das 30 ligas europeias ORUSEYE
on:
  workflow_dispatch:
  push:
    branches:
      - feature/bsd-europa-audit
    paths:
      - ".github/workflows/bsd-europa-audit.yml"
      - "tools/bsd_europa_audit.py"
      - "config/oruseye_europe30.json"
      - "tests/test_bsd_europa_audit.py"
permissions:
  contents: write
concurrency:
  group: bsd-europa-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic tests (no network)
        run: python -m unittest tests.test_bsd_europa_audit -v
      - name: Read-only BSD coverage audit (token never printed)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          set -o pipefail
          python -m tools.bsd_europa_audit bsd-europa-audit.json 2>&1 | tee bsd-europa-audit.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-europa-audit
          path: bsd-europa-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep report on this feature branch only (never main)
        if: always() && github.ref == 'refs/heads/feature/bsd-europa-audit'
        run: |
          mkdir -p reports
          cp bsd-europa-audit.json reports/ 2>/dev/null || true
          cp bsd-europa-audit.log reports/ 2>/dev/null || true
          echo "${{ github.run_id }}" > reports/bsd-europa-audit.run_id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports
          git diff --cached --quiet && exit 0
          git commit -m "reports: bsd europa audit run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:feature/bsd-europa-audit
