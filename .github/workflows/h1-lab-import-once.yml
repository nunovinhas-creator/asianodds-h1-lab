name: H1 - One-time verified LAB FT backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h1-lab-import-once.yml'

permissions:
  contents: write

# Identical mutex to the collector and original H1 results publisher.
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh latest published H1 and LAB snapshots
        run: |
          git pull --rebase origin main
          cp data/results.csv /tmp/h1_results_before_lab.csv
      - name: Run strict source, identity and triple ROI regression tests
        run: |
          python -m compileall -q h1lab
          python -m unittest discover -s tests -p 'test_h1_lab_promotion.py' -v
          python -m unittest discover -s tests -p 'test_results.py' -v
      - name: Import existing verified FT without querying an API
        run: |
          python -m h1lab.lab_promotion
          python -m h1lab.cli render
      - name: Verify immutable original H1 results and published triple calculations
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          def read(p):
              with open(p,encoding="utf-8",newline="") as f:
                  return {r["match_key"]:r for r in csv.DictReader(f)}
          before=read("/tmp/h1_results_before_lab.csv")
          after=read("data/results.csv")
          for key,old in before.items():
              assert after.get(key)==old, ("ORIGINAL_H1_RESULT_CHANGED",key)
          state=json.loads(Path("data/state.json").read_text())
          lab=json.loads(Path("data/lab/ft-ledger.json").read_text())["matches"]
          view=json.loads(Path("docs/data.json").read_text())
          eligible={s["match_key"] for s in state["signals"]
                    if lab.get(s["match_key"],{}).get("status")=="FINAL"}
          promoted=set(after)-set(before)
          assert promoted<=eligible, "NON_H1_OR_UNVERIFIED_PROMOTED"
          assert view["singles"]["settled"]==sum(
              s["result"] is not None for s in view["signals"])
          assert view["triples"]["settled"]==sum(
              t["profit"] is not None for t in view["tickets"])
          assert len(after)>=len(before), "H1_RESULTS_REMOVED"
          print("H1_LAB_BACKFILL_VERIFIED", "old",len(before),
                "promoted",len(promoted),"current",len(after),
                "singles",view["singles"]["settled"],
                "triples",view["triples"]["settled"])
          PY
      - name: Publish H1 ROI backfill and automatically remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/h1-lab-import-once.yml
          git add data/results.csv data/result_audit.json docs/data.json
          git commit -m "data(h1): import corroborated LAB finals into H1 [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo H1_LAB_BACKFILL_PUBLISHED_AND_WORKFLOW_REMOVED
              exit 0
            fi
            sleep 2
          done
          exit 1
