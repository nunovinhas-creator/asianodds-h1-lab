name: Atualizar ROI H1
on:
  push:
    paths:
      - "data/results.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recalcular singles e triplas com resultados confirmados
        run: python -m h1lab.cli render
      - name: Atualizar dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh H1 ROI [skip ci]"
            git push
          fi
