name: Atualizar ROI H1
on:
  push:
    paths:
      - "data/results.csv"
      - ".github/workflows/results.yml"
      - "h1lab/lab_promotion.py"
      - "tests/test_h1_lab_promotion.py"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Manual or delayed-schedule recovery
        required: false
        type: string
        default: manual
  schedule:
    # Consulta resultados finais de hora a hora, fora dos picos do minuto zero.
    - cron: "41 * * * *"

permissions:
  contents: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false

jobs:
  results:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile latest collector state
        run: |
          git pull --rebase origin main
          echo "H1_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Avoid duplicate queued result cycles
        id: due
        env:
          H1_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: python -m scripts.h1_results_watchdog due
      # Import already-certified LAB FT BEFORE spending the H1 supplier budget.
      # These source-validated finals are visible to the H1 planner as resolved.
      # No new result is accepted without the strict existing promotion gate.
      - name: Import confirmed LAB FT into H1 without changing signal rules
        if: steps.due.outputs.run == 'true'
        run: python -m h1lab.lab_promotion
      # BSD_API_KEY is read only within this step; never written to repository.
      # The 20-call cap is unchanged; the budget now excludes promoted FT.
      - name: Check BSD and TheSportsDB results with strict FT validation
        if: steps.due.outputs.run == 'true'
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python -m h1lab.results
      - name: Rebuild ROI for singles and triples
        if: steps.due.outputs.run == 'true'
        run: python -m h1lab.cli render
      - name: Record completed result cycle (not a coverage certificate)
        if: steps.due.outputs.run == 'true'
        run: python -m scripts.h1_results_watchdog receipt
      - name: Publish confirmed finals and audit
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv data/result_audit.json docs/data.json
          git add -f data/health/h1-results.json
          if ! git diff --cached --quiet; then
            git commit -m "data: reconcile verified H1 finals [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
