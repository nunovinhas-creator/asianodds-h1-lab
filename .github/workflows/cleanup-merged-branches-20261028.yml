name: Maintenance - remove verified merged PR branches 49-53
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-20261028.yml'
permissions:
  contents: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Delete only verified unchanged, merged PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import json
          import os

          # Every target's PR #49-53 is independently verified merged;
          # exact SHA protects any new work since its merge.
          targets = [
            ("fix/lab-ft-recovery-and-source-audit-20261028", "b660ae3b5456f84e1e1fb7a600d0345b5be690ff"),
            ("fix/lab-reviewed-three-ft-conflicts-20261028", "420304bb9e47877160d4d16a71578b5250a61429"),
            ("fix/lab-recover-five-verified-overdue-ft-20261028", "86f654aaa4adf602f3181be9afc3fa546e"),
            ("fix/lab-recover-five-more-verified-overdue-ft-20261028", "297a878c5238c920ac142057c8122be1ae26de97"),
            ("fix/h1-consume-verified-lab-finals-20261028", "1966f6a30b049c0e4fc1e7f763334dbe8d890baf"),
          ]
          # Refuse to delete any branch if one has new commits.
          present = []
          for branch, sha in targets:
              result = subprocess.check_output(
                  ["git", "ls-remote", "origin", f"refs/heads/{branch}"], text=True).strip()
              if not result:
                  print("ALREADY_DELETED", branch)
                  continue
              actual = result.split()[0]
              if actual != sha:
                  raise SystemExit(f"STOP_CHANGED_BRANCH {branch}")
              print("VERIFIED_UNCHANGED", branch)
              present.append(branch)

          extra = "chore/run-verified-branch-cleanup-20261028"
          extra_ref = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/heads/{extra}"], text=True).strip()
          if extra_ref:
              actual = extra_ref.split()[0]
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls?state=closed&per_page=100"],
                  text=True)
              prs = json.loads(raw)
              correct = [p for p in prs if p.get("merged_at") and
                         p.get("base", {}).get("ref") == "main" and
                         p.get("head", {}).get("ref") == extra and
                         p.get("head", {}).get("sha") == actual]
              if len(correct) != 1:
                  raise SystemExit("STOP_EXTRA_BRANCH_NOT_VERIFIED_MERGED")
              print("VERIFIED_SELF_BRANCH", extra, correct[0]["number"])

          for branch in present:
              subprocess.run(["git", "push", "origin", "--delete", branch], check=True)
              print("DELETED_BRANCH", branch)
          if extra_ref:
              subprocess.run(["git", "push", "origin", "--delete", extra], check=True)
              print("DELETED_SELF_PR_BRANCH", extra)

          for branch, _ in targets:
              if subprocess.check_output(
                      ["git", "ls-remote", "origin", f"refs/heads/{branch}"], text=True).strip():
                  raise SystemExit(f"STOP_STILL_EXISTS {branch}")
          if subprocess.check_output(
                  ["git", "ls-remote", "origin", f"refs/heads/{extra}"], text=True).strip():
              raise SystemExit("STOP_EXTRA_BRANCH_STILL_EXISTS")
          for preserved in ("main", "feature/bsd-europa-audit"):
              if not subprocess.check_output(
                      ["git", "ls-remote", "origin", f"refs/heads/{preserved}"],
                      text=True).strip():
                  raise SystemExit(f"STOP_MISSING_PRESERVED {preserved}")
          print("CLEANUP_SUCCESS_MAIN_AND_BSD_AUDIT_PRESERVED")
          PY
      - name: Self-delete completed maintenance workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-branches-20261028.yml
          git commit -m "chore: remove one-time verified branch cleanup [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo CLEANUP_WORKFLOW_SELF_REMOVED
              exit 0
            fi
            sleep 2
          done
          exit 1
