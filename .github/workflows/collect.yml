name: H1 - Collect Telegram
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origem do disparo (manual ou cloudflare-cron)"
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    # Avoid the first minute of each hour. Cron is best-effort on GitHub.
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile latest data checkpoint
        run: |
          git pull --rebase origin main
          # Publication base: the collector commit is transported over newer main from here.
          echo "COLLECT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Read authorised Telegram channel
        env:
          COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source || github.event_name }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python -m h1lab.cli collect
      # The collector commit is published BEFORE any Telegram request (E5 runs after this step).
      # No rebase, no force push, no re-collection and no Telegram request here.
      # Only the collector-owned paths of scripts/publication_ownership.py are staged
      # (never the whole data/lab directory) and transported over the current main
      # after every concurrent change was classified (docs/audit/collector-lab-publication-2026-11-02.md).
      - name: Store data for dashboard
        id: store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scripts.collect_publish_safe stage --park "$RUNNER_TEMP/collect-unexpected.patch"
          if ! git diff --cached --quiet; then
            git commit -q -m 'data: collect and notify H1 [skip ci]'
            python -m scripts.collect_publish_safe publish --base "$COLLECT_BASE_SHA" \
              --receipt "$RUNNER_TEMP/collect-publish-receipt.json" \
              --bundle "$RUNNER_TEMP/collect-unpublished.bundle"
          else
            echo "COLLECT_PUBLISH_RECEIPT {\"status\": \"NOTHING_TO_PUBLISH\"}"
          fi
      # THE ONLY ACTIVE TELEGRAM EMITTER: E5 (P5-8bced1b27e), Over 2,5 golos.
      # Retired and never invoked: 3+ Total moves, 2 Total rises, E1-E4, T05, H1 singles/triples,
      # Pattern Watch (h1lab/telegram_emitters.py). All future fixtures, no 12h cutoff, no game quota.
      # At-most-once: each intent is published on main (selective collector publication) BEFORE its
      # Telegram request; if that is impossible nothing is sent. Receipts: data/e5-over25-notifications.json.
      - name: Notify MASTER BRAIN E5 - Over 2,5 (exclusive)
        id: e5
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m h1lab.e5_notify
      - name: Keep the E5 receipt ledger when its publication failed
        if: failure() && steps.e5.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e5-receipts-${{ github.run_id }}
          path: |
            data/e5-over25-notifications.json
            data/telegram-delivery-block.json
          if-no-files-found: ignore
          retention-days: 90
      # Only on failure (every-5-minute successes are in the log as COLLECT_PUBLISH_RECEIPT).
      - name: Keep the failed collector publication receipt and bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-publish-receipt-${{ github.run_id }}
          # On failure the unpublished collector commit (state, receipts, block, V4 views) is kept.
          path: |
            ${{ runner.temp }}/collect-publish-receipt.json
            ${{ runner.temp }}/collect-unpublished.bundle
          if-no-files-found: ignore
          retention-days: 30
      # Tracked non-collector changes are never published; keep them for review when present.
      - name: Keep parked non-collector changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-unexpected-changes-${{ github.run_id }}
          path: ${{ runner.temp }}/collect-unexpected.patch
          if-no-files-found: ignore
          retention-days: 30
      # The FT watchdog has no Telegram or provider credentials. A failed read
      # must not prevent it from observing or waking an overdue FT run.
      - name: Wake overdue LAB FT workflow (nonblocking watchdog)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.lab_ft_watchdog
      - name: Wake overdue H1 results workflow (nonblocking watchdog)
        if: ${{ !cancelled() && steps.store.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.h1_results_watchdog
