name: H1 - Collect Telegram
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origem do disparo (manual ou cloudflare-cron)"
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    # Avoid the first minute of each hour. Cron is best-effort on GitHub.
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile latest data checkpoint
        run: git pull --rebase origin main
      - run: pip install -r requirements.txt
      - name: Read authorised Telegram channel
        env:
          COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source || github.event_name }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python -m h1lab.cli collect
      # Original Telegram rule 1 remains: >=3 separate V4 Total-line movements.
      # Legacy E4, T05, generic V5, H1 singles and triples stay DISABLED.
      # Keeps all future fixtures (no 12h cutoff) and sends once per match.
      - name: Notify MASTER BRAIN 3 verified Total movements
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Durable delivery state (see docs/audit/telegram-durable-activation.md). OFF unless the
          # repository variable TG_DURABLE_INTENT is exactly "1".
          TG_DURABLE_INTENT: ${{ vars.TG_DURABLE_INTENT == '1' && '1' || '0' }}
          TG_IGNORE_AUTH_BLOCK: ${{ vars.TG_IGNORE_AUTH_BLOCK == '1' && '1' || '0' }}
        run: python -m h1lab.three_moves_notify
      # ADDITIVE alert. The existing three-movement sender above is unchanged.
      # At least two independent upward V4 Total moves, net >= 0.50, no V4 fall.
      - name: Notify MASTER BRAIN 2 distinct Total rises (additional)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Durable delivery state (see docs/audit/telegram-durable-activation.md). OFF unless the
          # repository variable TG_DURABLE_INTENT is exactly "1".
          TG_DURABLE_INTENT: ${{ vars.TG_DURABLE_INTENT == '1' && '1' || '0' }}
          TG_IGNORE_AUTH_BLOCK: ${{ vars.TG_IGNORE_AUTH_BLOCK == '1' && '1' || '0' }}
        run: python -m h1lab.two_up_notify
      - name: Store data for dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json docs/data.json
          if [ -f data/pattern-notifications.json ]; then git add data/pattern-notifications.json; fi
          if [ -f data/three-total-moves-notifications.json ]; then git add data/three-total-moves-notifications.json; fi
          if [ -f data/two-up-total-notifications.json ]; then git add data/two-up-total-notifications.json; fi
          # Shared Telegram pause (429 retry_after / 401 / 403): committed so it survives between jobs.
          if [ -f data/telegram-delivery-block.json ] || git ls-files --error-unmatch data/telegram-delivery-block.json >/dev/null 2>&1; then git add -A -- data/telegram-delivery-block.json; fi
          if [ -d data/lab ]; then git add data/lab; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect and notify H1 [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
      # A missing GitHub schedule can starve authenticated FT lookups.
      # Runs ONLY after H1 has persisted alerts and notifications.
      # Does not modify H1/Telegram or block data publication on failure.
      - name: Wake overdue LAB FT workflow (nonblocking watchdog)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.lab_ft_watchdog
      - name: Wake overdue H1 results workflow (nonblocking watchdog)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.h1_results_watchdog
