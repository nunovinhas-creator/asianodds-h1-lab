name: H1 - Collect Telegram
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    # Avoid the first minute of each hour. Cron is best-effort on GitHub.
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile latest data checkpoint
        run: git pull --rebase origin main
      - run: pip install -r requirements.txt
      - name: Read authorised Telegram channel
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python -m h1lab.cli collect
      # Real delivery is enabled only with the two dedicated Bot API secrets.
      - name: Notify new H1 triples to configured bot chat
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m h1lab.notify
      - name: Store data for dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect and notify H1 [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
