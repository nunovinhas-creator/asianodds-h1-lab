name: H1 - Collect Telegram
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origem do disparo (manual ou cloudflare-cron)"
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    # Avoid the first minute of each hour. Cron is best-effort on GitHub.
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile latest data checkpoint
        run: |
          git pull --rebase origin main
          # Publication base: the collector commit is transported over newer main from here.
          echo "COLLECT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Read authorised Telegram channel
        env:
          COLLECT_TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source || github.event_name }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python -m h1lab.cli collect
      # Original Telegram rule 1 remains: >=3 separate V4 Total-line movements.
      # Legacy E4, T05, generic V5, H1 singles and triples stay DISABLED.
      # Keeps all future fixtures (no 12h cutoff) and sends once per match.
      - name: Notify MASTER BRAIN 3 verified Total movements
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Durable delivery state (see docs/audit/telegram-durable-activation.md). OFF unless the
          # repository variable TG_DURABLE_INTENT is exactly "1".
          TG_DURABLE_INTENT: ${{ vars.TG_DURABLE_INTENT == '1' && '1' || '0' }}
          TG_IGNORE_AUTH_BLOCK: ${{ vars.TG_IGNORE_AUTH_BLOCK == '1' && '1' || '0' }}
        run: python -m h1lab.three_moves_notify
      # ADDITIVE alert. The existing three-movement sender above is unchanged.
      # At least two independent upward V4 Total moves, net >= 0.50, no V4 fall.
      - name: Notify MASTER BRAIN 2 distinct Total rises (additional)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Durable delivery state (see docs/audit/telegram-durable-activation.md). OFF unless the
          # repository variable TG_DURABLE_INTENT is exactly "1".
          TG_DURABLE_INTENT: ${{ vars.TG_DURABLE_INTENT == '1' && '1' || '0' }}
          TG_IGNORE_AUTH_BLOCK: ${{ vars.TG_IGNORE_AUTH_BLOCK == '1' && '1' || '0' }}
        run: python -m h1lab.two_up_notify
      # Telegram may already have been sent above. A Git conflict is only a Git problem:
      # no rebase, no force push, no re-collection and no new Telegram request here.
      # Only the collector-owned paths of scripts/publication_ownership.py are staged
      # (never the whole data/lab directory) and transported over the current main
      # after every concurrent change was classified (docs/audit/collector-lab-publication-2026-11-02.md).
      - name: Store data for dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scripts.collect_publish_safe stage
          if ! git diff --cached --quiet; then
            git commit -q -m 'data: collect and notify H1 [skip ci]'
            python -m scripts.collect_publish_safe publish --base "$COLLECT_BASE_SHA" \
              --receipt "$RUNNER_TEMP/collect-publish-receipt.json" \
              --bundle "$RUNNER_TEMP/collect-unpublished.bundle"
          else
            echo "COLLECT_PUBLISH_RECEIPT {\"status\": \"NOTHING_TO_PUBLISH\"}"
          fi
      # Only on failure (every-5-minute successes are in the log as COLLECT_PUBLISH_RECEIPT).
      - name: Keep the failed collector publication receipt and bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-publish-receipt-${{ github.run_id }}
          # On failure the unpublished collector commit (state, receipts, block, V4 views) is kept.
          path: |
            ${{ runner.temp }}/collect-publish-receipt.json
            ${{ runner.temp }}/collect-unpublished.bundle
          if-no-files-found: ignore
          retention-days: 30
      # A missing GitHub schedule can starve authenticated FT lookups.
      # Runs ONLY after H1 has persisted alerts and notifications.
      # Does not modify H1/Telegram or block data publication on failure.
      - name: Wake overdue LAB FT workflow (nonblocking watchdog)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.lab_ft_watchdog
      - name: Wake overdue H1 results workflow (nonblocking watchdog)
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.h1_results_watchdog
