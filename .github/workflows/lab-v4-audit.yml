name: Lab - Audit V4 vs H1 (shadow)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["H1 - Collect Telegram"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Independent lab mutex: never block or delay the five-minute H1 collector.
concurrency:
  group: asianodds-lab-v4-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read latest completed H1 checkpoint
        run: |
          git pull --rebase origin main
          echo "LAB_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # V6 is append-only and shadow-only. It records the actual processing
      # time, never a backdated Telegram timestamp, before any FT analysis.
      # Continue to collect diagnostics; the final barrier rejects partial bundles.
      - name: Freeze V6 market baselines and audit price quality (shadow)
        id: v6_capture
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_shadow.py' -v
          python -m unittest discover -s tests -p 'test_v6_features_v2.py' -v
          python -m scripts.lab_v6_shadow
          python -m scripts.lab_v6_feature_coverage
      # V6.1 P1 preparation only: scientific memory stays a shadow.
      # It does not promote hypotheses until the P0 7/14-day readiness gates.
      - name: Synchronize and replay V6 scientific memories (shadow)
        id: v6_science_memory
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_science_memory.py' -v
          python -m scripts.lab_v6_memory
          python -m scripts.lab_v6_memory --verify-only
      # V6 hypothesis falsification reads ONLY frozen forecasts and
      # verified FT evidence from the scientific memory (never H1 decisions).
      # Missing or old context => INSUFFICIENT_N, not retroactive inference.
      - name: Investigate V6 hypothesis with ten falsification screens (shadow)
        id: v6_falsification
        if: steps.v6_science_memory.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_falsification.py' -v
          python -m scripts.lab_v6_falsification
          python -m scripts.lab_v6_falsification --verify-only
      - name: Validate V4 audit tests before publication
        run: |
          python -m unittest discover -s tests -p 'test_v4_audit.py' -v
          python -m unittest discover -s tests -p 'test_v4_logscan.py' -v
      - name: Build audit and inspect triggering collector logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAB_COLLECT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: python -m scripts.lab_v4_audit
      - name: Build independent Golden Set review queue and report
        run: python -m scripts.lab_golden
      - name: Select high-information source events for Golden review
        run: python -m scripts.lab_golden_priority
      # Descriptive chronology participates in the atomic LAB publication bundle.
      - name: Build per-match chronology of repeated alerts
        id: timeline
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_timeline.py'
          python -m scripts.lab_match_trajectories
      # A separate descriptive study of repeated messages. It uses the
      # already-built timeline and refuses to consume a stale source commit.
      # Never changes H1, ROI, picks, FIFO or Telegram notifications.
      - name: Analyse repeated alert trajectories (exploratory only)
        id: trajectory
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_trajectory_research.py' -v
          python -m scripts.lab_trajectory_research
      # Aggregate readiness check; failure blocks this LAB bundle, never the H1 collector.
      - name: Join repeated games with available H1 FT records (coverage only)
        id: outcome
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_outcome_readiness.py' -v
          python -m scripts.lab_outcome_readiness
      # V4 revision journal is written during the H1 collector's V4-only
      # shadow persistence; this step only replays it. Never reconstruct
      # edits from an updated latest-view row.
      - name: Rebuild and verify immutable V4 edit history (shadow)
        id: v4_revisions
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v4_revisions.py' -v
          python -m scripts.lab_v4_revisions
          python -m scripts.lab_v4_revisions --verify-only
      # V6.2: a bounded scientific proof view, rebuilt from 5 memory streams,
      # immutable forecast registration and independent universal FT event journal.
      - name: Build verified V6.2 Scientific Radar (shadow-only)
        id: v6_scientific_radar
        if: steps.v6_science_memory.outcome == 'success' && steps.v6_falsification.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_scientific_radar.py' -v
          python -m scripts.lab_v6_scientific_radar
          python -m scripts.lab_v6_scientific_radar --verify-only
      # Weekly monitor runs in the EXISTING LAB audit, creating a snapshot
      # only on the first completed audit of a new ISO week. Thus no new
      # GitHub workflow jobs, provider requests, or noisy commits every 5m.
      - name: Weekly V6 calibration and drift monitor (shadow)
        id: v6_weekly
        continue-on-error: true
        run: |
          python -m scripts.lab_v6_weekly_monitor
          python -m scripts.lab_v6_weekly_monitor --verify-only
      # P2#14 runs in the existing LAB audit; no cron and no provider calls.
      # It verifies ALL LAB file sizes, monthly seals and replay of SHA chains.
      - name: Publish bounded monthly archive inventory (shadow)
        id: lab_archive
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_lab_archive.py' -v
          python -m scripts.lab_v6_archive
          python -m scripts.lab_v6_archive --verify-only
      # P0 nulos: computed once/frozen. Every audit replays science gates only.
      # No new cron or provider calls; independent Git run-log proof is still required.
      - name: Publish P0 7/14-day scientific gates and 10k-null fixed experiment
        id: v6_p0
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_p0_gates.py' -v
          python -m scripts.lab_v6_p0
          python -m scripts.lab_v6_p0 --verify-only
      # No partial producer output is eligible for publication, even when its
      # step used continue-on-error. outcome (not conclusion) preserves failure.
      - name: Commit only shadow audit artifacts
        env:
          PUBLICATION_STEPS: ${{ toJSON(steps) }}
        run: |
          python -m scripts.publication_guard outcomes --pipeline audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lab/v4-audit.json docs/lab/golden-candidates.json docs/lab/golden-report.json docs/lab/golden-priority.json
          if [ "${{ steps.v4_revisions.outcome }}" = "success" ]; then
            if [ -f docs/lab/v4-revisions.json ]; then git add docs/lab/v4-revisions.json; fi
          fi
          if [ -f data/lab/v4-runchecks.jsonl ]; then git add data/lab/v4-runchecks.jsonl; fi
          if [ "${{ steps.lab_archive.outcome }}" = "success" ]; then
            git add -f data/lab/v6-archive-index.json
            git add docs/lab/v6-archive-health.json
          fi
          if [ "${{ steps.v6_scientific_radar.outcome }}" = "success" ]; then
            if [ -f docs/lab/v6-scientific-radar.json ]; then git add docs/lab/v6-scientific-radar.json; fi
          fi
          if [ "${{ steps.v6_weekly.outcome }}" = "success" ]; then
            if [ -f data/lab/v6-weekly-snapshots.jsonl ]; then git add -f data/lab/v6-weekly-snapshots.jsonl; fi
            if [ -f docs/lab/v6-weekly-drift.json ]; then git add docs/lab/v6-weekly-drift.json; fi
          fi
          if [ -f docs/lab/v6-shadow.json ]; then git add docs/lab/v6-shadow.json; fi
          if [ -f docs/lab/v6-readiness.json ]; then git add docs/lab/v6-readiness.json; fi
          if [ "${{ steps.v6_p0.outcome }}" = "success" ]; then
            git add docs/lab/v6-p0-null-simulation.json docs/lab/v6-p0-gates.json
          fi
          # A failed memory step can leave partial local files; never publish them.
          if [ "${{ steps.v6_science_memory.outcome }}" = "success" ]; then
            if [ -f docs/lab/v6-memory.json ]; then git add docs/lab/v6-memory.json; fi
            git add -f data/lab/v6-memory-*.jsonl 2>/dev/null || true
          fi
          if [ "${{ steps.v6_falsification.outcome }}" = "success" ]; then
            if [ -f docs/lab/v6-falsification.json ]; then git add docs/lab/v6-falsification.json; fi
          fi
          if [ "${{ steps.v6_capture.outcome }}" = "success" ] && [ -f docs/lab/v6-feature-coverage.json ]; then
            git add docs/lab/v6-feature-coverage.json
          fi
          if [ -f docs/lab/v6-price-quality.json ]; then git add docs/lab/v6-price-quality.json; fi
          git add -f data/lab/v6-forecasts-*.jsonl 2>/dev/null || true
          if [ -f data/lab/v6-hypotheses.jsonl ]; then git add -f data/lab/v6-hypotheses.jsonl; fi
          if [ -f docs/lab/match-trajectories.json ]; then git add docs/lab/match-trajectories.json; fi
          if [ -f docs/lab/trajectory-research.json ]; then git add docs/lab/trajectory-research.json; fi
          if [ -f docs/lab/outcome-readiness.json ]; then git add docs/lab/outcome-readiness.json; fi
          python -m scripts.publication_guard seal --pipeline audit --manifest "$RUNNER_TEMP/publication-seal.json"
          if ! git diff --cached --quiet; then
            git commit -m 'data(lab): refresh V4 comparison and log checks [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              python -m scripts.publication_guard verify --manifest "$RUNNER_TEMP/publication-seal.json"
              if git push origin HEAD:main; then
                echo "LAB_AUDIT_PUBLISHED"
                exit 0
              fi
              sleep 2
            done
            echo "LAB_AUDIT_PUBLISH_FAILED"
            exit 1
          fi
