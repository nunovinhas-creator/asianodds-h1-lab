name: Lab - Audit V4 vs H1 (shadow)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["H1 - Collect Telegram"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Independent lab mutex: never block or delay the five-minute H1 collector.
concurrency:
  group: asianodds-lab-v4-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read latest completed H1 checkpoint
        run: |
          git pull --rebase origin main
          echo "LAB_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # V6 is append-only and shadow-only. It records the actual processing
      # time, never a backdated Telegram timestamp, before any FT analysis.
      # Failure does not block the established V4/Golden or H1 pipelines.
      - name: Freeze V6 market baselines and audit price quality (shadow)
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_v6_shadow.py' -v
          python -m scripts.lab_v6_shadow
      - name: Validate V4 audit tests before publication
        run: |
          python -m unittest discover -s tests -p 'test_v4_audit.py' -v
          python -m unittest discover -s tests -p 'test_v4_logscan.py' -v
      - name: Build audit and inspect triggering collector logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAB_COLLECT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: python -m scripts.lab_v4_audit
      - name: Build independent Golden Set review queue and report
        run: python -m scripts.lab_golden
      - name: Select high-information source events for Golden review
        run: python -m scripts.lab_golden_priority
      # Descriptive per-match chronology. A failure here must not block the
      # V4/Golden publication above; the previous JSON simply stays in place.
      - name: Build per-match chronology of repeated alerts
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_timeline.py'
          python -m scripts.lab_match_trajectories
      # A separate descriptive study of repeated messages. It uses the
      # already-built timeline and refuses to consume a stale source commit.
      # Never changes H1, ROI, picks, FIFO or Telegram notifications.
      - name: Analyse repeated alert trajectories (exploratory only)
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_trajectory_research.py' -v
          python -m scripts.lab_trajectory_research
      # A purely aggregate readiness check: may fail without affecting V4, Golden,
      # or the production H1 collector and its result reconciliation.
      - name: Join repeated games with available H1 FT records (coverage only)
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_outcome_readiness.py' -v
          python -m scripts.lab_outcome_readiness
      - name: Commit only shadow audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lab/v4-audit.json docs/lab/golden-candidates.json docs/lab/golden-report.json docs/lab/golden-priority.json
          if [ -f data/lab/v4-runchecks.jsonl ]; then git add data/lab/v4-runchecks.jsonl; fi
          if [ -f docs/lab/v6-shadow.json ]; then git add docs/lab/v6-shadow.json; fi
          git add -f data/lab/v6-forecasts-*.jsonl 2>/dev/null || true
          if [ -f docs/lab/match-trajectories.json ]; then git add docs/lab/match-trajectories.json; fi
          if [ -f docs/lab/trajectory-research.json ]; then git add docs/lab/trajectory-research.json; fi
          if [ -f docs/lab/outcome-readiness.json ]; then git add docs/lab/outcome-readiness.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(lab): refresh V4 comparison and log checks [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "LAB_AUDIT_PUBLISHED"
                exit 0
              fi
              sleep 2
            done
            echo "LAB_AUDIT_PUBLISH_FAILED"
            exit 1
          fi
