name: Lab - Audit V4 vs H1 (shadow)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["H1 - Collect Telegram"]
    types: [completed]

permissions:
  contents: write
  actions: read

# Same write mutex as collector; never change collector or its five-minute trigger.
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read latest completed H1 checkpoint
        run: |
          git pull --rebase origin main
          echo "LAB_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate V4 audit tests before publication
        run: python -m unittest tests/test_v4_audit.py -v
      - name: Build audit and inspect triggering collector logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAB_COLLECT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: python -m scripts.lab_v4_audit
      - name: Commit only shadow audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lab/v4-audit.json
          if [ -f data/lab/v4-runchecks.jsonl ]; then git add data/lab/v4-runchecks.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(lab): refresh V4 comparison and log checks [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
