name: LAB - GOAL and OpenFoot one-time FT activation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-goal-openfoot-once.yml'
permissions:
  contents: write
concurrency:
  group: asianodds-lab-ft-results
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh inputs
        run: git pull --rebase origin main
      - name: Run strict FT source tests
        run: |
          python -m unittest discover -s tests -p 'test_lab_goal_openfoot.py' -v
          python -m unittest discover -s tests -p 'test_lab_results.py' -v
      - name: Check source keys exist without exposing them
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          assert os.getenv("GOAL_API_KEY","").strip(), "GOAL_API_KEY_SECRET_MISSING"
          assert os.getenv("OPENFOOT_API_KEY","").strip(), "OPENFOOT_API_KEY_SECRET_MISSING"
          print("GOAL_AND_OPENFOOT_KEYS_PRESENT_VALUES_NOT_LOGGED")
          PY
      - name: Snapshot previous LAB outcomes
        run: cp data/lab/ft-ledger.json /tmp/lab_ft_before_new_sources.json
      - name: Reconcile max 30 eligible games, max two dates per new provider
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL || secrets.API_FOOTBALL_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          LAB_API_FOOTBALL_SCHEDULED: 'false'
          LAB_NEW_FT_ONE_SHOT: 'true'
          LAB_FOTMOB_LICENSED: '0'
          LAB_RESULTS_MAX_CHECKS: '30'
          LAB_BSD_DATE_MAX_DAYS: '3'
          LAB_BSD_DATE_MAX_PAGES: '3'
        run: python -m scripts.lab_results
      - name: Confirm real source calls, conflicts and FT gains
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/lab/ft-results.json').read_text())
          previous=json.loads(Path('/tmp/lab_ft_before_new_sources.json').read_text())['matches']
          after=json.loads(Path('data/lab/ft-ledger.json').read_text())['matches']
          goal=report['goal_search']; foot=report['openfoot_search']
          assert goal['configured'] and foot['configured']
          assert goal['poll_enabled'] and foot['poll_enabled']
          assert 1<=goal['requests']<=2 and 1<=foot['requests']<=2
          assert report['final_recorded']>=sum(x['status']=='FINAL' for x in previous.values())
          assert report['status_counts'].get('SOURCE_ORDER_CONFLICT',0)>=4
          assert report['fotmob_search']['requests']==0
          assert all(row['status']=='FINAL' for key,row in previous.items()
                     if row['status']=='FINAL')
          changed=[(key,row) for key,row in after.items()
                   if row['status']=='FINAL' and previous.get(key,{}).get('status')!='FINAL']
          print('LAB_GOAL_OPENFOOT_AUDIT', 'matches',report['matches'],
            'final',report['final_recorded'],
            'goal_calls',goal['requests'],'goal_validations',goal['verified_in_run'],
            'openfoot_calls',foot['requests'],'openfoot_validations',foot['verified_in_run'],
            'new_FT',len(changed), 'goal_reasons',goal['reason_counts'],
            'openfoot_reasons',foot['reason_counts'])
          for key,r in changed:
              print('LAB_NEW_FT',key,r['home'],r['away'],
                    r['result']['home_goals'],r['result']['away_goals'],
                    r['result']['evidence'])
          PY
      - name: Save only LAB scores and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lab/ft-ledger.json docs/lab/ft-results.json
          git rm .github/workflows/lab-goal-openfoot-once.yml
          git commit -m 'data(lab): GOAL and OpenFoot FT activation [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo LAB_NEW_FT_SOURCES_PUBLISHED
              exit 0
            fi
            sleep 2
          done
          echo LAB_NEW_FT_SOURCES_PUBLISH_FAILED
          exit 1
