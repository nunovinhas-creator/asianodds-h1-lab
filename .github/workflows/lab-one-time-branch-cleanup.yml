name: One-time LAB cleanup after FT merges
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-one-time-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Delete only four verified merged LAB heads and self-remove
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [lab/ft-provider-diagnostics-20261028]=b11099d7fe498be98e462f6edf6f740f6990f607
            [lab/bsd-core-crosswalk-20261028]=f89102b8780471f6f35fa1f24ec7d2b882ecef9a
            [lab/ft-alternative-provider-20261028]=236f44d03af60575b31fb87bea530b4b95e43ef6
            [lab/ft-official-api-fallback-20261028]=a91f58e4d2569e409a35c9d563af3d2b248a5bc9
          )
          for branch in "${!expected[@]}"; do
            sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [[ "$sha" != "${expected[$branch]}" ]]; then
              echo "REF_CHANGED_ABORT $branch"
              exit 1
            fi
          done
          for branch in "${!expected[@]}"; do
            git push origin --delete "$branch"
            echo "DELETED_VERIFIED_BRANCH $branch"
          done
          heads="$(git ls-remote --heads origin | sed 's/.*refs\/heads\///' | sort)"
          echo "$heads"
          test "$heads" = "$(printf 'feature/bsd-europa-audit\nmain')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lab-one-time-branch-cleanup.yml
          git commit -m 'chore: remove one-time merged LAB branch cleanup [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "CLEANUP_FINISHED_TWO_BRANCHES"
              exit 0
            fi
            sleep 2
          done
          echo "CLEANUP_SELF_REMOVAL_FAILED"
          exit 1
