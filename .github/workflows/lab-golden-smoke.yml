name: Lab - Golden Set smoke (PR)
on:
  pull_request:
    paths:
      - "h1lab/golden.py"
      - "h1lab/golden_priority.py"
      - "scripts/lab_golden_priority.py"
      - "tests/test_golden_priority.py"
      - "scripts/lab_golden.py"
      - "tests/test_golden.py"
      - "docs/golden-review.html"
      - "data/lab/golden/reviews/**"
      - "data/lab/golden/corroborations/**"
      - ".github/workflows/lab-golden-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Golden reference and source validation
        run: python -m unittest discover -s tests -p 'test_golden.py' -v
      - name: Test rare-case selection rules
        run: python -m unittest discover -s tests -p 'test_golden_priority.py' -v
      - name: Generate first queue from real tracked Telegram observations
        run: python -m scripts.lab_golden
      - name: Generate source-priority queue from real observations
        run: python -m scripts.lab_golden_priority
      - name: Validate no model odds are prefilled and source is not certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pool=json.loads(Path("docs/lab/golden-candidates.json").read_text())
          report=json.loads(Path("docs/lab/golden-report.json").read_text())
          priority=json.loads(Path("docs/lab/golden-priority.json").read_text())
          assert priority["status"] == "SELECTION_ONLY_NOT_VERIFIED"
          assert priority["no_reference_values_prefilled"] is True
          assert priority["source_event_count"] >= 4
          assert "1x2_selection_X" in priority["not_observed_in_source"] or priority["feature_coverage"]["1x2_selection_X"]["observed_events"] > 0
          assert all("markets" not in p and "source_url" not in p for p in priority["priorities"])
          assert len({p["event_id"] for p in priority["priorities"]}) == len(priority["priorities"])
          assert any("ah_line_changed_in_1x2" in p["features"] for p in priority["priorities"])
          assert any("total_line_changed_in_1x2" in p["features"] for p in priority["priorities"])
          assert pool["no_reference_values_prefilled"] is True
          assert report["status"] == "NOT_CERTIFIED"
          assert report["golden_set_verified"] is False
          target = {case["event_id"]: case for case in report["cases"]}
          for number, expected in (("50655", 7), ("50656", 7), ("50658", 19)):
              eid = "3571094759:" + number
              item = target[eid]
              assert item["single_review_source_kind"] == "telegram_copied_text", eid
              assert item["single_review_compared_fields"] == expected, eid
              assert item["single_review_matched_fields"] == expected, eid
              assert item["status"] == "AWAITING_REVIEWS", eid
              assert item["reviews_received"] == 1, eid
          print("GOLDEN_REAL_TEXT_REVIEWS_MATCH_V4", {x: target["3571094759:"+x]["single_review_matched_fields"] for x in ("50655","50656","50658")})
          assert 0 <= report["user_validated_case_count"] <= report["candidate_count"]
          assert report["user_validated_case_count"] >= 1
          target = next(item for item in report["cases"]
                        if item["event_id"] == "3571094759:50671")
          assert target["firsthand_user_validation"] == "CONFIRMED_BY_SOURCE_VIEWER"
          assert target["firsthand_verified_fields"] == 19
          assert target["telegram_authenticated_externally"] is False
          assert target["reviews_received"] == 1
          assert all("second_independent_review" in item for item in report["cases"]
                     if item["status"] == "USER_SOURCE_VALIDATED")
          assert report["supplemental_corroboration_count"] <= report["candidate_count"]
          assert all(item["independent_reviewer"] is False
                     and item["telegram_authenticity_verified"] is False
                     for item in report["supplemental_corroborations"])
          assert 0 <= report["two_review_agreements"] <= report["candidate_count"]
          assert report["two_review_agreements"] + report["v4_mismatch_cases"] <= report["candidate_count"]
          assert pool["eligible_per_family"]["1x2"] >= 1
          assert pool["eligible_per_family"]["total_up"] >= 1
          assert pool["eligible_per_family"]["total_down"] >= 1
          assert pool["candidates"]
          for c in pool["candidates"]:
              assert "markets" not in c
              assert "source_url" not in c
          print("GOLDEN_REAL_SOURCE_QUEUE",
                pool["eligible_per_family"],"selected",report["candidate_count"],
                "human_verification",report["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: golden-review-queue
          path: |
            docs/lab/golden-candidates.json
            docs/lab/golden-report.json
            docs/lab/golden-priority.json
          retention-days: 7
