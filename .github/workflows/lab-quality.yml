name: Lab - Build quality report (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asianodds-h1-write
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.lab_quality
      - name: Commit aggregate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lab/quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update lab quality aggregate [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
