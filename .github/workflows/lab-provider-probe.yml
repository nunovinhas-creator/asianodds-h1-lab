name: LAB - Diagnostic external FT source coverage (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe bounded public daily match lists without settlement
        run: python -m scripts.lab_provider_probe
